blank_issues_enabled: false
contact_links:
  - name: Early-user workflow feedback
    url: https://github.com/joynes/terminalhub/issues/new?template=activation_feedback.yml
    about: Tell us where first-server, first-project, multi-tab, restart, or reconnect setup was difficult.
  - name: Setup and workflow questions
    url: https://github.com/joynes/terminalhub/discussions
    about: Ask for help or discuss an idea before turning it into an issue.
  - name: Security vulnerability
    url: https://github.com/joynes/terminalhub/security/advisories/new
    about: Report vulnerabilities privately. Never put credentials in a report.
  - name: Documentation
    url: https://joynes.github.io/terminalhub/
    about: Read setup, feature, security, troubleshooting, and architecture documentation.
