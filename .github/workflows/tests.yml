name: Tests and coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install native and integration-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux openssh-sftp-server
          sdkmanager 'ndk;29.0.14206865' 'platforms;android-36'
      - name: Run JVM tests, including local tmux and SFTP integrations
        run: ./gradlew :app:testDiagnosticDebugUnitTest :terminal-emulator:testDebugUnitTest :terminal-view:testDebugUnitTest
      - name: Test coverage reporting
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: jvm-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  android-coverage:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install native and integration-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux openssh-sftp-server
          sdkmanager 'ndk;29.0.14206865' 'platforms;android-36'
      - name: Run Android tests and enforce 95% app line coverage
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:appCoverageVerification
      - name: Summarize measured coverage
        if: always() && hashFiles('app/build/reports/jacoco/appCoverageReport/report.xml') != ''
        run: python3 scripts/coverage_summary.py app/build/reports/jacoco/appCoverageReport/report.xml --json app/build/reports/jacoco/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-tests-and-coverage
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/jacoco/
            app/build/reports/coverage/
          retention-days: 14
